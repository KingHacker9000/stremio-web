name: Sync Sense With Upstream Stremio Web

on:
  push:
    branches: [sense-mvp]
    paths:
      - '.github/workflows/sync-upstream-sense.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sense-upstream-sync
  cancel-in-progress: false

jobs:
  sync-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sense branch
        uses: actions/checkout@v4
        with:
          ref: sense-mvp
          fetch-depth: 0

      - name: Fetch official Stremio Web
        run: |
          git remote add upstream https://github.com/Stremio/stremio-web.git || true
          git fetch upstream development

      - name: Check whether sync is needed
        id: sync
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/development HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Sense already contains latest upstream development."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt conflict-safe upstream merge
        if: steps.sync.outputs.needed == 'true'
        id: merge
        shell: bash
        run: |
          git config user.name "stremio-sense-bot"
          git config user.email "68105674+KingHacker9000@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff upstream/development
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U | tee /tmp/sense-conflicts.txt
            git merge --abort
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report incompatible upstream update safely
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'false'
        shell: bash
        run: |
          upstream_sha="$(git rev-parse upstream/development)"
          conflicts="$(cat /tmp/sense-conflicts.txt)"
          echo "::warning title=Sense upstream sync blocked::Upstream $upstream_sha conflicts with Sense. Current validated Sense branch remains untouched."
          {
            echo "## Sense upstream sync blocked"
            echo
            echo "The automatic update was **not** applied because latest Stremio Web conflicts with Sense changes. The currently validated Sense build remains untouched."
            echo
            echo "Upstream development: \`$upstream_sha\`"
            echo
            echo '```text'
            echo "$conflicts"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        with:
          version: 11
          run_install: false

      - name: Install merged dependencies
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Test merged tree
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        run: pnpm exec jest --runInBand

      - name: Build merged tree
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        run: pnpm build

      - name: Publish validated upstream update
        if: steps.sync.outputs.needed == 'true' && steps.merge.outputs.ok == 'true'
        run: |
          git commit -m "chore: sync latest Stremio Web development"
          git push origin HEAD:sense-mvp
