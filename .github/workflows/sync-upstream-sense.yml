name: Sync Sense With Upstream Stremio Web

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sense-upstream-sync
  cancel-in-progress: false

jobs:
  sync-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sense branch
        uses: actions/checkout@v4
        with:
          ref: sense-mvp
          fetch-depth: 0

      - name: Fetch official Stremio Web
        run: |
          git remote add upstream https://github.com/Stremio/stremio-web.git || true
          git fetch upstream development

      - name: Check whether sync is needed
        id: sync
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/development HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Sense already contains latest upstream development."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage upstream merge without publishing it
        if: steps.sync.outputs.needed == 'true'
        run: |
          git config user.name "stremio-sense-bot"
          git config user.email "68105674+KingHacker9000@users.noreply.github.com"
          git merge --no-commit --no-ff upstream/development

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.needed == 'true'
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        if: steps.sync.outputs.needed == 'true'
        with:
          version: 11
          run_install: false

      - name: Install merged dependencies
        if: steps.sync.outputs.needed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run tests on merged tree
        if: steps.sync.outputs.needed == 'true'
        run: pnpm exec jest --runInBand

      - name: Production build merged tree
        if: steps.sync.outputs.needed == 'true'
        run: pnpm build

      - name: Publish validated upstream merge
        if: steps.sync.outputs.needed == 'true'
        run: |
          git commit -m "chore: sync latest Stremio Web development"
          git push origin HEAD:sense-mvp
