name: Sync Sense With Upstream Stremio Web

on:
  push:
    branches: [sense-mvp]
    paths:
      - '.github/workflows/sync-upstream-sense.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sense-upstream-sync
  cancel-in-progress: false

jobs:
  sync-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sense branch
        uses: actions/checkout@v4
        with:
          ref: sense-mvp
          fetch-depth: 0

      - name: Fetch official Stremio Web
        run: |
          git remote add upstream https://github.com/Stremio/stremio-web.git || true
          git fetch upstream development

      - name: Check whether sync is needed
        id: sync
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/development HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Sense already contains latest upstream development."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture Sense-only patch
        if: steps.sync.outputs.needed == 'true'
        shell: bash
        run: |
          base="$(git merge-base HEAD upstream/development)"
          echo "Sense merge base: $base"
          git diff --binary "$base"..HEAD > /tmp/sense.patch
          test -s /tmp/sense.patch

      - name: Rebuild branch from clean upstream
        if: steps.sync.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "stremio-sense-bot"
          git config user.email "68105674+KingHacker9000@users.noreply.github.com"
          git reset --hard upstream/development
          git clean -fdx
          git apply --3way /tmp/sense.patch

      - uses: actions/setup-node@v4
        if: steps.sync.outputs.needed == 'true'
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        if: steps.sync.outputs.needed == 'true'
        with:
          version: 11
          run_install: false

      - name: Install dependencies
        if: steps.sync.outputs.needed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Run tests on regenerated Sense tree
        if: steps.sync.outputs.needed == 'true'
        run: pnpm exec jest --runInBand

      - name: Production build regenerated Sense tree
        if: steps.sync.outputs.needed == 'true'
        run: pnpm build

      - name: Publish validated regenerated Sense branch
        if: steps.sync.outputs.needed == 'true'
        shell: bash
        run: |
          git add -A
          git commit -m "chore: regenerate Sense on latest Stremio Web development"
          git push --force-with-lease origin HEAD:sense-mvp
