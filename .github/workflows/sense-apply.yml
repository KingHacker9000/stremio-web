name: Apply Stremio Sense Web MVP
on:
  push:
    branches: [sense-mvp]
permissions:
  contents: write
jobs:
  apply-build:
    if: github.event.head_commit.message == 'Apply Stremio Sense Web MVP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Patch current MetaDetails seam
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/MetaDetails/MetaDetails.js')
          s = p.read_text()
          old_import = "const useSeason = require('./useSeason');\n"
          new_import = old_import + "const SenseMoreLikeThis = require('./SenseMoreLikeThis');\n"
          if new_import not in s:
              if old_import not in s:
                  raise SystemExit('MetaDetails import anchor changed')
              s = s.replace(old_import, new_import, 1)
          anchor = "                <div className={styles['spacing']} />\n"
          row = "                {\n                    metaDetails.metaItem !== null && metaDetails.metaItem.content.type === 'Ready' ?\n                        <SenseMoreLikeThis metaId={metaDetails.metaItem.content.content.id} /> : null\n                }\n"
          if row not in s:
              if anchor not in s:
                  raise SystemExit('MetaDetails row anchor changed')
              s = s.replace(anchor, row + anchor, 1)
          p.write_text(s)
          q = Path('.sense/apply.py')
          t = q.read_text()
          call = "    patch(root/'src/routes/MetaDetails/MetaDetails.js',meta)\n"
          if call not in t:
              raise SystemExit('patcher MetaDetails call missing')
          q.write_text(t.replace(call, "    # MetaDetails patched by workflow\n", 1))
          PY
      - name: Apply Sense patch
        run: python .sense/apply.py .
      - name: Localize Sense Downloads UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/Downloads/Downloads.js')
          s = p.read_text()
          s = s.replace("const React = require('react');\n", "const React = require('react');\nconst { useTranslation } = require('react-i18next');\n", 1)
          s = s.replace("    const navigate = useNavigate();\n    const [url, setUrl]", "    const navigate = useNavigate();\n    const { t } = useTranslation();\n    const [url, setUrl]", 1)
          marker = "const Downloads = () => {\n    const { downloadId } = useParams();\n    const navigate = useNavigate();\n"
          replacement = marker + "    const { t } = useTranslation();\n"
          if marker not in s:
              raise SystemExit('Downloads hook anchor changed')
          s = s.replace(marker, replacement, 1)
          replacements = {
              '>Back to Downloads</Button>': ">{t('sense_downloads_back', { defaultValue: 'Back to Downloads' })}</Button>",
              '>Opening offline media…</div>': ">{t('sense_downloads_opening', { defaultValue: 'Opening offline media…' })}</div>",
              '>Downloads</div>': ">{t('sense_downloads_title', { defaultValue: 'Downloads' })}</div>",
              '>Saved locally on this device. Nothing is uploaded to Stremio Sense.</div>': ">{t('sense_downloads_privacy', { defaultValue: 'Saved locally on this device. Nothing is uploaded to Stremio Sense.' })}</div>",
              '>No offline media yet. Open a stream menu and choose Download video.</div>': ">{t('sense_downloads_empty', { defaultValue: 'No offline media yet. Open a stream menu and choose Download video.' })}</div>",
              '>Play Offline</Button>': ">{t('sense_downloads_play_offline', { defaultValue: 'Play Offline' })}</Button>",
              '>Pause</Button>': ">{t('sense_downloads_pause', { defaultValue: 'Pause' })}</Button>",
              '>Resume</Button>': ">{t('sense_downloads_resume', { defaultValue: 'Resume' })}</Button>",
              '>Delete</Button>': ">{t('sense_downloads_delete', { defaultValue: 'Delete' })}</Button>",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'i18n anchor changed: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Declare pnpm 11 build-script policy
        run: |
          cat >> pnpm-workspace.yaml <<'EOF'
          
          allowBuilds:
            onnxruntime-node: false
            protobufjs: false
            sharp: false
          EOF
      - name: Remove patch kit
        run: rm -rf .sense .github/workflows/sense-apply.yml
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11 --activate
          pnpm install --no-frozen-lockfile
      - name: Test
        run: pnpm exec jest --runInBand
      - name: Build
        run: pnpm build
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Stremio Sense Web MVP'
          git push origin HEAD:sense-mvp
